name: Concept2 Minute Field Fix

on:
  push:
    branches: [fix/executable-week-targets]
    paths:
      - '.github/workflows/row-minute-field-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/executable-week-targets
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fix Concept2 minute field selector
        run: python3 scripts/fix-row-minute-field.py
      - name: Verify syntax and regressions
        run: |
          node --check app.js
          node --test tests/*.test.cjs
      - name: Commit verified selector fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/weekly-targets.test.cjs
          git diff --cached --quiet && exit 1
          git commit -m "Fix Concept2 minute field selector"
          git push origin HEAD:fix/executable-week-targets
