name: Phase 1 Fat-Loss Guardrail

on:
  push:
    branches: [fix/phase1-fat-loss-guardrail]
    paths:
      - '.github/workflows/phase1-fat-loss-guardrail.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase1-fat-loss-guardrail
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Phase 1 guardrail correction
        run: python3 scripts/apply-phase1-fat-loss-guardrail.py
      - name: Verify syntax and regressions
        run: |
          node --check app.js
          node --test tests/*.test.cjs
      - name: Commit verified product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/nutrition-trend-guardrail.test.cjs
          git diff --cached --quiet && exit 1
          git commit -m "Tune Phase 1 fat-loss guardrail"
          git push origin HEAD:fix/phase1-fat-loss-guardrail
