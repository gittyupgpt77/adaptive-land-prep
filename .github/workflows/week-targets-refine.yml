name: Week Targets Refinement

on:
  push:
    branches: [fix/executable-week-targets]
    paths:
      - '.github/workflows/week-targets-refine.yml'

permissions:
  contents: write

jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/executable-week-targets
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Align actual work with time-based Concept2 targets
        run: python3 scripts/refine-week-targets-patch.py
      - name: Verify syntax and regressions
        run: |
          node --check app.js
          node --test tests/*.test.cjs
      - name: Commit verified refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html tests/weekly-targets.test.cjs
          git diff --cached --quiet && exit 1
          git commit -m "Align Concept2 actuals with weekly time targets"
          git push origin HEAD:fix/executable-week-targets
