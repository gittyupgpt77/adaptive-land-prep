name: Executable Week Targets Patch

on:
  push:
    branches: [fix/executable-week-targets]
    paths:
      - '.github/workflows/week-targets-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/executable-week-targets
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply week-specific target and actual-work corrections
        run: python3 scripts/apply-week-targets-patch.py
      - name: Verify syntax and regressions
        run: |
          node --check app.js
          node --test tests/*.test.cjs
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html service-worker.js
          git diff --cached --quiet && exit 1
          git commit -m "Expose exact weekly training targets and actual work"
          git push origin HEAD:fix/executable-week-targets
