name: Readiness False Precision Patch

on:
  push:
    branches:
      - fix/readiness-false-precision

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden legacy score-field matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/readiness-false-precision-patch.cjs')
          s=p.read_text()
          old="app=app.replace('overall:d.o,score:d.score,decision:d,','overall:d.o,decision:d,');"
          new="app=app.replace(/score:d\\.score,/g,'');"
          if old not in s:
              raise SystemExit('legacy score matcher not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Apply categorical readiness patch
        run: node scripts/readiness-false-precision-patch.cjs
      - name: Syntax check
        run: node --check app.js
      - name: Run regression suite
        run: npm test
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css tests/readiness-display-integrity.test.cjs
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Replace readiness score with categorical state"
          git push
