name: Readiness False Precision Patch

on:
  push:
    branches:
      - fix/readiness-false-precision

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply categorical readiness patch
        run: node scripts/readiness-false-precision-patch.cjs
      - name: Syntax check
        run: node --check app.js
      - name: Run regression suite
        run: npm test
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css tests/readiness-display-integrity.test.cjs
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Replace readiness score with categorical state"
          git push
