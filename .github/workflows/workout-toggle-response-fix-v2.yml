name: Workout Response Routing Fix v2

on:
  push:
    branches: [fix/workout-toggle-response]
    paths:
      - '.github/workflows/workout-toggle-response-fix-v2.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workout-toggle-response
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/fix-workout-toggle-response.py
      - run: |
          node --check app.js
          node --test tests/*.test.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 1
          git commit -m "Open workout response capture deterministically"
          git push origin HEAD:fix/workout-toggle-response
