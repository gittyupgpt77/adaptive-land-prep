name: UI Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - '.github/workflows/ui-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Start local app
        run: python3 -m http.server 8080 >/tmp/server.log 2>&1 &
      - name: Capture iPhone viewport
        run: |
          cat > audit.mjs <<'JS'
          import { webkit } from 'playwright';
          const browser = await webkit.launch();
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2 });
          await page.goto('http://127.0.0.1:8080', { waitUntil: 'networkidle' });
          await page.screenshot({ path: 'today.png', fullPage: true });
          await page.locator('#taskCheckin').click(); await page.waitForTimeout(200); await page.screenshot({ path: 'checkin.png', fullPage: true }); await page.locator('#closeCheckin').click();
          for (const [target,name] of [['workout','train'],['week','week'],['trends','trends'],['program','program']]) {
            await page.locator('[data-target="'+target+'"]').click();
            await page.waitForTimeout(300);
            await page.screenshot({ path: name+'.png', fullPage: true });
            if (target==='workout') {
              const lib=page.locator('[data-trainview="library"]'); await lib.click(); await page.locator('#librarySearch').fill('plank'); await page.waitForTimeout(150); await page.screenshot({path:'library-search.png',fullPage:true}); await page.locator('[data-trainview="session"]').click();
              const ex=page.locator('.exercise-card').nth(1); if(await ex.count()){await ex.click();await page.waitForTimeout(150);await page.screenshot({path:'exercise-detail.png',fullPage:true});await page.locator('#modalDone').click();}
            }
            if (target==='week') {
              const d=page.locator('.day-button').nth(1); if(await d.count()){await d.click();await page.waitForTimeout(150);await page.screenshot({path:'day-training.png',fullPage:true});await page.locator('[data-daytab="nutrition"]').click();await page.waitForTimeout(120);await page.screenshot({path:'day-nutrition.png',fullPage:true});await page.locator('#daySheetClose').click();}
              await page.locator('[data-calview="month"]').click();await page.waitForTimeout(180);await page.screenshot({path:'month.png',fullPage:true});
            }
            if (target==='workout') { const ex=page.locator('.exercise-card').nth(1); if(await ex.count()){await ex.click();await page.waitForTimeout(200);await page.screenshot({path:'exercise-detail.png',fullPage:true});await page.locator('#modalDone').click();} }
            if (target==='week') { const d=page.locator('.day-button').nth(1); if(await d.count()){await d.click();await page.waitForTimeout(200);await page.screenshot({path:'day-training.png
            day-nutrition.png
            month.png
            library-search.png',fullPage:true});} }
          }
          await browser.close();
          JS
          node audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-ui-audit
          path: |
            today.png
            train.png
            week.png
            trends.png
            program.png
            checkin.png
            exercise-detail.png
            week-expanded.png
