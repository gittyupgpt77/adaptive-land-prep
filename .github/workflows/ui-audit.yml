name: UI Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - '.github/workflows/ui-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm install playwright
      - run: npx playwright install --with-deps webkit
      - name: Start local app
        run: python3 -m http.server 8080 >/tmp/server.log 2>&1 &
      - name: Capture iPhone viewport
        run: |
          cat > audit.mjs <<'JS'
          import { webkit } from 'playwright';
          const browser = await webkit.launch();
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2 });
          await page.goto('http://127.0.0.1:8080', { waitUntil: 'networkidle' });

          await page.screenshot({ path: 'today.png', fullPage: true });

          await page.evaluate(() => {
            const d=new Date(); d.setDate(d.getDate()-2);
            localStorage.programStart=d.toISOString();
            localStorage.trainingLogs='[]';
            localStorage.workoutHistory='[]';
            localStorage.failedDays='[]';
          });
          await page.reload({waitUntil:'networkidle'});
          await page.waitForTimeout(120);
          await page.screenshot({ path: 'missed-day.png', fullPage: true });

          await page.evaluate(() => {
            localStorage.clear();
          });
          await page.reload({waitUntil:'networkidle'});

          await page.locator('#taskCheckin').click();
          await page.waitForTimeout(150);
          await page.screenshot({ path: 'checkin.png', fullPage: true });
          await page.locator('#closeCheckin').click();

          await page.locator('[data-target="workout"]').click();
          await page.waitForTimeout(200);
          await page.screenshot({ path: 'train.png', fullPage: true });

          await page.locator('[data-trainview="library"]').click();
          await page.locator('#librarySearch').fill('plank');
          await page.waitForTimeout(120);
          await page.screenshot({ path: 'library-search.png', fullPage: true });
          await page.locator('[data-trainview="session"]').click();

          const ex = page.locator('.exercise-card').nth(1);
          if (await ex.count()) {
            await ex.click();
            await page.waitForTimeout(120);
            await page.screenshot({ path: 'exercise-detail.png', fullPage: true });
            await page.locator('#modalDone').click();
          }

          await page.locator('[data-target="week"]').click();
          await page.waitForTimeout(200);
          await page.screenshot({ path: 'week.png', fullPage: true });

          const d = page.locator('.day-button').nth(1);
          if (await d.count()) {
            await d.click();
            await page.waitForTimeout(120);
            await page.screenshot({ path: 'day-training.png', fullPage: true });
            await page.locator('[data-daytab="nutrition"]').click();
            await page.waitForTimeout(120);
            await page.screenshot({ path: 'day-nutrition.png', fullPage: true });
            await page.locator('#daySheetClose').click();
          }

          await page.locator('[data-calview="month"]').click();
          await page.waitForTimeout(150);
          await page.screenshot({ path: 'month.png', fullPage: true });

          await page.locator('[data-target="trends"]').click();
          await page.waitForTimeout(150);
          await page.screenshot({ path: 'trends.png', fullPage: true });

          await page.locator('[data-target="program"]').click();
          await page.waitForTimeout(150);
          await page.screenshot({ path: 'program.png', fullPage: true });

          await browser.close();
          JS
          node audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-ui-audit
          path: |
            today.png
            missed-day.png
            checkin.png
            train.png
            library-search.png
            exercise-detail.png
            week.png
            day-training.png
            day-nutrition.png
            month.png
            trends.png
            program.png
