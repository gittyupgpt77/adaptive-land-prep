name: Phase 1 Promotion Intent Patch

on:
  push:
    branches:
      - fix/phase-intent-readiness

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused logic patch
        run: node scripts/phase1-promotion-intent-patch.cjs
      - name: Syntax check
        run: node --check app.js
      - name: Run regression suite
        run: npm test
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/phase-objective-intent.test.cjs
          git commit -m "Align Phase 1 promotion with phase intent"
          git push
