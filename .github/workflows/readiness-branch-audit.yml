name: Readiness Branch Audit

on:
  push:
    branches: [fix/readiness-false-precision]

concurrency:
  group: readiness-branch-audit
  cancel-in-progress: true

jobs:
  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci
      - run: npm run build:firebase && git diff --exit-code -- vendor/firebase.js
      - run: npm run test:firebase

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check app.js && node --check service-worker.js && node --check cloud.js && node --check cloud-core.js && node --check autosave-core.js
      - name: Persistence regression tests
        run: node --test tests/*.test.cjs
      - run: npm ci && npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps webkit
      - name: Start local app
        run: python3 -m http.server 8080 >/tmp/server.log 2>&1 &
      - name: Extract permanent consumer simulation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ui-audit.yml').read_text()
          start_marker = "          cat > audit.mjs <<'JS'\n"
          end_marker = "\n          JS\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          body = text[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          Path('audit.mjs').write_text(body)
          PY
          node --check audit.mjs
      - name: Run consumer simulation
        run: node audit.mjs
      - name: Firebase browser recovery regression
        run: npm run test:firebase-browser
      - name: Automatic cloud browser regression
        run: node tests/cloud-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-branch-audit
          path: |
            consumer-report.json
            audit-cloud/
            01-fresh-today.png
            02-started-today.png
            03-readiness-detail.png
            03b-session-response.png
            04-library.png
            05-month.png
            06-journey.png
            07-nutrition.png
            08-program.png
            09-insights.png
            09-missed-day.png
