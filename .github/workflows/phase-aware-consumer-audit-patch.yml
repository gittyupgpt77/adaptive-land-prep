name: Phase-aware Consumer Audit Patch

on:
  push:
    branches:
      - fix/phase-aware-consumer-audit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch consumer audit fixture
        run: node scripts/phase-aware-consumer-audit-patch.cjs
      - name: Verify workflow still contains intended checks
        run: |
          grep -q "Saved yellow state surfaces adaptation explanation" .github/workflows/ui-audit.yml
          grep -q "Saved yellow state changes actual prescription" .github/workflows/ui-audit.yml
          grep -q "#fatigue').selectOption('3')" .github/workflows/ui-audit.yml
      - name: Commit audit fixture correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ui-audit.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align consumer yellow-state fixture with readiness domains"
          git push
