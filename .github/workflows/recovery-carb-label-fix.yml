name: Recovery Carbohydrate Label Fix

on:
  push:
    branches: [fix/recovery-carb-label]
    paths:
      - '.github/workflows/recovery-carb-label-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recovery-carb-label
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/fix-recovery-carb-label.py
      - run: |
          node --check app.js
          node --test tests/*.test.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 1
          git commit -m "Restore explicit recovery carbohydrate label"
          git push origin HEAD:fix/recovery-carb-label
