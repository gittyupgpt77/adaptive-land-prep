name: Daily Loop Coherence Patch

on:
  push:
    branches: [fix/daily-loop-coherence]
    paths:
      - '.github/workflows/daily-loop-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-loop-coherence
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused daily-loop corrections
        run: python3 scripts/apply-daily-loop-patch.py
      - name: Verify syntax and regressions
        run: |
          node --check app.js
          node --test tests/*.test.cjs
      - name: Commit verified application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 1
          git commit -m "Preserve adaptive prescriptions across the daily loop"
          git push origin HEAD:fix/daily-loop-coherence
