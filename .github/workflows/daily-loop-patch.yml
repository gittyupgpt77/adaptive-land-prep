name: Daily Loop Coherence Patch

on:
  push:
    branches: [fix/daily-loop-coherence]
    paths:
      - '.github/workflows/daily-loop-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-loop-coherence
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused daily-loop corrections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app_path=Path('app.js')
          source=app_path.read_text()

          def must_replace(old,new,label):
              global source
              if old not in source:
                  raise SystemExit(f'missing patch target: {label}')
              source=source.replace(old,new,1)

          def replace_between(start,end,replacement,label):
              global source
              a=source.find(start)
              if a<0:
                  raise SystemExit(f'missing start marker: {label}')
              b=source.find(end,a)
              if b<0:
                  raise SystemExit(f'missing end marker: {label}')
              source=source[:a]+replacement.rstrip()+'\n'+source[b:]

          must_replace(
          'function logs(){return JSON.parse(localStorage.trainingLogs||"[]")}function workouts(){return JSON.parse(localStorage.workoutHistory||"[]")}\nfunction todayKey(){return new Date().toDateString()}function todayCheckin(){return logs().find(x=>new Date(x.date).toDateString()===todayKey())}function todayWorkout(){return workouts().find(x=>new Date(x.date).toDateString()===todayKey()&&x.completed==="YES")}',
          'function logs(){return JSON.parse(localStorage.trainingLogs||"[]")}function workouts(){return JSON.parse(localStorage.workoutHistory||"[]")}\nfunction todayKey(){return new Date().toDateString()}function todayCheckin(){return logs().find(x=>new Date(x.date).toDateString()===todayKey())}function todayWorkoutRecord(){return workouts().find(x=>new Date(x.date).toDateString()===todayKey())}function todayWorkout(){const x=todayWorkoutRecord();return x?.completed==="YES"?x:null}',
          'today workout record helper')

          replace_between('function adaptiveSession(){','function readinessBreakdown(){',r'''
          function adaptiveSessionFor(name,d){
           const base=makeSession(name),dec=d?.decision;
           if(!d||!dec)return base;
           if(dec.b==="RED")return{title:"Mechanical Recovery Override",type:"Recovery",duration:"20–45 min",effort:"Very easy / pain-free",why:"Pain or altered movement triggered the mechanical stop rule. Impact and loaded walking are removed until the red flag resolves.",steps:[ex("Easy row or walk","20–30 min","Continuous","Only if pain-free and movement remains normal.","Recovery"),ex("Gentle mobility","10–15 min","—","Use comfortable ranges only.","Mobility")]};
           if(dec.o==="RED")return{title:"Recovery Override",type:"Recovery",duration:"25–50 min",effort:"Very easy",why:"Systemic recovery is too suppressed for the planned workload. Today prioritizes recovery while preserving routine.",steps:[ex("Easy row","20–40 min","Continuous","Conversational effort; finish fresher than you started.","Recovery"),ex("Light mobility","10 min","—","Gentle, non-fatiguing movement.","Mobility"),ex("Easy trunk work","2 light sets","60 sec","No grinding or failure.","Core")]};
           if(dec.o==="YELLOW"){
             const steps=base.steps.map(e=>{const n=e.name.toLowerCase();if(/quality|threshold|interval/.test(n))return ex("Easy aerobic substitute","20–40 min","Continuous","Replace hard work with easy aerobic work today.","Recovery");return{...e,dose:reduceDoseText(e.dose),cue:e.cue+" Keep today comfortably submaximal."}});
             return{...base,title:base.title+" · Modified",effort:"Reduced",why:"Recovery or fueling signals warrant a lower-stress version of the planned session.",steps};
           }
           return base;
          }
          function adaptiveSession(){return adaptiveSessionFor(sessionName(),todayCheckin())}
          '''),'adaptive session by saved decision')

          replace_between('function saveWorkout(c){','const EXERCISE_DB_BASE=',r'''
          function saveWorkout(c){
           if(!localStorage.programStart){beginJourney();return}
           const status=c||"YES",rpe=num("sessionRPE"),postPain=num("postPain"),needsFeedback=status==="YES"||status==="PARTIAL";
           if(needsFeedback&&(rpe===null||postPain===null)){
             $("sessionFeedback").open=true;
             $("completionBanner").textContent="Add effort and post-session pain before saving this session.";
             $("completionBanner").classList.add("attention");$("completionBanner").classList.remove("hidden");
             setTimeout(()=>$("completionBanner").classList.add("hidden"),2200);return
           }
           const arr=workouts(),prescription=adaptiveSession(),entry={date:new Date().toISOString(),week:prescriptionWeek(),session:prescription.title,prescription,rpe,duration:num("sessionDuration"),postPain,completed:status,note:val("sessionNote")};
           const existing=arr.findIndex(x=>dayKey(x.date)===todayKey());if(existing>=0)arr.splice(existing,1);arr.unshift(entry);
           localStorage.workoutHistory=JSON.stringify(arr);dbSet("workoutHistory",localStorage.workoutHistory);setTask("workout",entry.completed==="YES");
           $("sessionFeedback").open=false;$("completionBanner").classList.remove("attention");
           $("completionBanner").textContent=status==="YES"?"Session complete ✓":status==="PARTIAL"?"Partial session saved":"Skipped session saved";
           $("completionBanner").classList.remove("hidden");setTimeout(()=>$("completionBanner").classList.add("hidden"),1600);renderAll()
          }
          '''),'workout completion semantics')

          must_replace('const d=todayCheckin(),det=adaptiveSession(),done=todayWorkout();','const d=todayCheckin(),det=adaptiveSession(),record=todayWorkoutRecord(),done=record?.completed==="YES";','today render workout record')
          must_replace('$("taskWorkoutSub").textContent=done?"Completed today":det.duration+" · "+det.effort;','$("taskWorkoutSub").textContent=done?"Completed today":record?.completed==="PARTIAL"?"Partial session recorded · review details":record?.completed==="NO"?"Skipped today · review if this changes":det.duration+" · "+det.effort;','today workout status copy')
          must_replace('const done=todayWorkout();$("completeWorkoutQuick").textContent=done?"✓ Session Complete":"Review & Complete Session";$("completeWorkoutQuick").disabled=!!done;$("postSessionPrompt").classList.toggle("done",!!done);renderLibrary()}','const record=todayWorkoutRecord(),done=record?.completed==="YES";$("completeWorkoutQuick").textContent=done?"✓ Session Complete":record?.completed==="PARTIAL"?"Partial saved · Review":record?.completed==="NO"?"Skipped · Review":"Review & Complete Session";$("completeWorkoutQuick").disabled=!!done;$("postSessionPrompt").classList.toggle("done",!!done);renderLibrary()}','train completion state')

          must_replace('log.targetCalories=target.cal;log.targetProtein=target.protein;log.targetCarbs=target.carbs;log.targetFat=target.fat;','log.targetCalories=target.cal;log.targetProtein=target.protein;log.targetCarbs=target.carbs;log.targetFat=target.fat;log.prescribedMeals=meals.map(m=>({...m,foods:[...m.foods]}));log.prescriptionReason=target.adjustment?.copy||target.why;','nutrition prescription history')

          replace_between('function dateSession(d){','function renderJourney(){',r'''
          function checkinForDate(d){const k=dayKey(d);return logs().find(x=>dayKey(x.date)===k)||null}
          function workoutForDate(d){const k=dayKey(d);return workouts().find(x=>dayKey(x.date)===k)||null}
          function dateSession(d){
           const w=programWeekForDate(d),bl=blockForWeek(w),name=daysFor(bl)[programDayIndex(d)],work=workoutForDate(d),check=checkinForDate(d);
           const det=work?.prescription||adaptiveSessionFor(name,check);
           return{w,bl,name,det,work,check}
          }
          function dateState(d){const k=dayKey(d),check=!!checkinForDate(d),record=workoutForDate(d),status=record?.completed||"",work=status==="YES",failed=JSON.parse(localStorage.failedDays||"[]").includes(k);return{check,work,status,failed}}
          function openDaySheet(d,tab="training"){const x=dateSession(d);window.selectedDay=new Date(d);$("daySheetKicker").textContent="WEEK "+x.w+" · "+x.bl.name.toUpperCase();$("daySheetTitle").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});$("daySheet").classList.remove("hidden");document.querySelectorAll(".day-tab").forEach(b=>b.classList.toggle("active",b.dataset.daytab===tab));renderDaySheetTab(tab)}
          function nutritionHtmlForDate(d,x){
           const log=getNutritionLog(d),check=checkinForDate(d),n={...nutritionForWeek(x.w,x.name)},dec=check?.decision;
           let adjustment=null;
           if(Number(log.targetCalories)>0){n.cal=Number(log.targetCalories);if(Number(log.targetProtein)>=0)n.protein=Number(log.targetProtein);if(Number(log.targetCarbs)>=0)n.carbs=Number(log.targetCarbs);if(Number(log.targetFat)>=0)n.fat=Number(log.targetFat)}
           else if(dec?.c==="RED"){n.cal+=200;n.carbs+=50;adjustment={level:"red",title:"Recovery fueling override",copy:"This day’s saved readiness decision called for additional carbohydrate and a review of the energy deficit."}}
           else if(dec?.c==="YELLOW"){adjustment={level:"yellow",title:"Carbohydrate timing emphasis",copy:"This day’s saved readiness decision called for keeping intake near target while emphasizing carbohydrate around training."}}
           const meals=Array.isArray(log.prescribedMeals)&&log.prescribedMeals.length?log.prescribedMeals:mealPlanForWeek(x.w);
           const recorded=log.saved?'<div class="nutrition-note"><strong>Recorded intake</strong><p>'+(Number.isFinite(log.actualCalories)?Math.round(log.actualCalories).toLocaleString()+' kcal recorded. ':'')+'This is the intake saved for this date.</p></div>':'';
           return '<div class="nutrition-hero"><small>'+n.phase.toUpperCase()+'</small><strong>≈ '+n.cal.toLocaleString()+' kcal</strong><p>'+(log.prescriptionReason||n.why)+'</p></div><div class="macro-grid"><div><span>Protein</span><strong>'+n.protein+' g</strong></div><div><span>Carbs</span><strong>'+n.carbs+' g</strong></div><div><span>Fat</span><strong>'+n.fat+' g</strong></div></div>'+(adjustment?'<div class="nutrition-adjustment '+adjustment.level+'"><strong>'+adjustment.title+'</strong><span>'+adjustment.copy+'</span></div>':'')+'<div class="calendar-meal-plan">'+meals.map(m=>'<div><small>'+m.kcal+' KCAL</small><strong>'+m.name+'</strong><p>'+m.foods.join(" · ")+'</p></div>').join("")+'</div>'+recorded+'<div class="nutrition-note"><strong>Adaptive rule</strong><p>Readiness and body-weight trend override an aggressive deficit when recovery or performance deteriorates.</p></div>'
          }
          function renderDaySheetTab(tab){
           const d=window.selectedDay||new Date(),x=dateSession(d),state=dateState(d);
           if(tab==="nutrition"){
             $("daySheetBody").innerHTML=nutritionHtmlForDate(d,x)+(dayKey(d)===todayKey()?'<button class="nutrition-complete" id="nutritionCompleteBtn">'+(getNutritionLog().saved?"✓ Intake saved":"Open today’s nutrition log")+'</button>':"");
             if($("nutritionCompleteBtn"))$("nutritionCompleteBtn").onclick=()=>{$("daySheet").classList.add("hidden");switchTab("nutrition")};return
           }
           const trainingLabel=state.status==="YES"?'<span class="done">✓ Training complete</span>':state.status==="PARTIAL"?'<span>◐ Partial session</span>':state.status==="NO"?'<span class="failed">× Session skipped</span>':'<span>○ Training</span>';
           $("daySheetBody").innerHTML='<div class="day-status-line"><span class="'+(state.check?"done":"")+'">'+(state.check?"✓":"○")+' Check-in</span>'+trainingLabel+(state.failed?'<span class="failed">× Missed day</span>':'')+'</div><div class="day-training-hero"><small>'+x.det.type.toUpperCase()+'</small><h3>'+x.det.title+'</h3><p>'+x.det.why+'</p></div><div class="day-exercises">'+x.det.steps.map((e,i)=>'<button data-dayex="'+i+'"><b>'+(i+1)+'</b><div><strong>'+e.name+'</strong><small>'+e.dose+' · '+e.rest+'</small></div><span>›</span></button>').join("")+'</div>';
           $("daySheetBody").querySelectorAll("[data-dayex]").forEach(b=>b.onclick=()=>openExercise(x.det.steps[+b.dataset.dayex]))
          }
          '''),'calendar history fidelity')

          must_replace('const det=makeSession(name),date=dateFor(w,i),is=date.toDateString()===todayKey(),state=dateState(date);','const date=dateFor(w,i),det=dateSession(date).det,is=date.toDateString()===todayKey(),state=dateState(date);','week uses effective prescription')
          must_replace('(state.failed?"×":state.check&&state.work?"✓":"○")','(state.failed?"×":state.status==="PARTIAL"?"◐":state.status==="NO"?"×":state.check&&state.work?"✓":"○")','week partial skip glyph')

          app_path.write_text(source)

          test_path=Path('tests/session-history.test.cjs')
          tests=test_path.read_text()
          old="const start=source.indexOf('function adaptiveSession(){');\n  vm.runInContext(source.slice(start,source.indexOf('\\nfunction ',source.indexOf('function adaptiveSession(){')+1)),context);"
          new="const start=source.indexOf('function adaptiveSessionFor(');\n  vm.runInContext(source.slice(start,source.indexOf('\\nfunction readinessBreakdown',start)),context);"
          if old not in tests:
              raise SystemExit('missing session-history adaptive extraction')
          tests=tests.replace(old,new,1)
          tests=tests.replace("assert.equal(saved.session,expected);\n  assert.equal(saved.rpe,5);", "assert.equal(saved.session,expected);\n  assert.equal(saved.prescription.title,expected);\n  assert.equal(saved.rpe,5);",1)
          test_path.write_text(tests)

          Path('tests/daily-loop-coherence.test.cjs').write_text(r'''const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const vm=require('node:vm');
          const path=require('node:path');
          const source=fs.readFileSync(path.join(__dirname,'../app.js'),'utf8');

          test('historical calendar prefers the saved adapted prescription',()=>{
            const savedPrescription={title:'Recovery Override',type:'Recovery',duration:'25 min',effort:'Very easy',why:'Saved reason',steps:[]};
            const rows=[{date:'2026-09-07T12:00:00Z',completed:'PARTIAL',prescription:savedPrescription}];
            const checks=[{date:'2026-09-07T08:00:00Z',decision:{o:'YELLOW',b:'GREEN'}}];
            const context=vm.createContext({
              localStorage:{failedDays:'[]'},logs:()=>checks,workouts:()=>rows,dayKey:d=>new Date(d).toDateString(),
              programWeekForDate:()=>1,blockForWeek:()=>({name:'Re-entry I'}),daysFor:()=>['Base session'],programDayIndex:()=>0,
              adaptiveSessionFor:()=>({title:'Reconstructed'}),nutritionForWeek:()=>({phase:'x',cal:1,protein:1,carbs:1,fat:1,why:''}),
              getNutritionLog:()=>({}),mealPlanForWeek:()=>[],$:()=>({}),document:{querySelectorAll:()=>[]},window:{},todayKey:()=>new Date('2026-09-07T12:00:00Z').toDateString()
            });
            const start=source.indexOf('function checkinForDate('),end=source.indexOf('\nfunction renderJourney(){',start);
            vm.runInContext(source.slice(start,end),context);
            const x=context.dateSession(new Date('2026-09-07T18:00:00Z'));
            assert.equal(x.det.title,'Recovery Override');
            const state=context.dateState(new Date('2026-09-07T18:00:00Z'));
            assert.equal(state.status,'PARTIAL');assert.equal(state.work,false);
          });

          test('partial sessions require effort and pain feedback just like completed sessions',()=>{
            const nodes={sessionFeedback:{open:false},completionBanner:{textContent:'',classList:{add(){},remove(){}}}};
            const localStorage={programStart:'2026-09-01'};
            const context=vm.createContext({
              localStorage,$:id=>nodes[id]??={value:''},num:()=>null,val:()=>'',beginJourney(){},setTimeout(){},workouts:()=>[],adaptiveSession:()=>({title:'Base',steps:[]}),
              prescriptionWeek:()=>1,dayKey:x=>x,todayKey:()=> 'today',dbSet(){},setTask(){},renderAll(){}
            });
            const start=source.indexOf('function saveWorkout(c){'),end=source.indexOf('\nconst EXERCISE_DB_BASE=',start);
            vm.runInContext(source.slice(start,end),context);
            context.saveWorkout('PARTIAL');
            assert.equal(localStorage.workoutHistory,undefined);
            assert.match(nodes.completionBanner.textContent,/effort and post-session pain/i);
          });
          ''').replace(/^          /gm,''))
          PY
      - name: Verify syntax and focused regressions
        run: |
          node --check app.js
          node --test tests/*.test.cjs
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/session-history.test.cjs tests/daily-loop-coherence.test.cjs
          git commit -m "Preserve adaptive prescriptions across the daily loop"
          git push origin HEAD:fix/daily-loop-coherence
