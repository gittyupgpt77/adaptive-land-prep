name: Weekly Ceiling Copy

on:
  push:
    branches: [fix/weekly-ceiling-copy]
    paths:
      - '.github/workflows/weekly-ceiling-copy.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weekly-ceiling-copy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply weekly ceiling copy correction
        run: python3 scripts/apply-weekly-ceiling-copy.py
      - name: Verify syntax and regressions
        run: |
          node --check app.js
          node --test tests/*.test.cjs
      - name: Commit verified product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 1
          git commit -m "Clarify weekly running ceilings in session doses"
          git push origin HEAD:fix/weekly-ceiling-copy
