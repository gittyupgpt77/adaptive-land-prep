name: Calibration Transparency

on:
  push:
    branches: [feat/calibration-transparency]
    paths:
      - '.github/workflows/calibration-transparency.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calibration-transparency
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply calibration transparency
        run: python3 scripts/apply-calibration-transparency.py
      - name: Verify syntax and regressions
        run: |
          node --check app.js
          node --test tests/*.test.cjs
      - name: Commit verified product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 1
          git commit -m "Clarify nutrition and weight calibration state"
          git push origin HEAD:feat/calibration-transparency
